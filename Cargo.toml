[package]
name = "event_source"
version = "0.1.0"
authors = ["Duane R Bailey <bailey.d.r@gmail.com>"]
edition = "2018"

[features]
default = ["sqlite"]

dynamo = ["rusoto_dynamodb", "rusoto_core", "tokio", "futures"]
sqlite = ["rusqlite"]
psql = ["postgres"]

httpd = ["log", "dotenv", "warp", "futures", "tokio-timer", "hyper", "tokio"]
httpc = ["hyper", "tokio", "futures"]

[dependencies]
bytes = "*"
serde = "*"
serde_json = "*"
serde_derive = "*"
pretty_env_logger = "*"
either = "*"
chashmap = "*"

log = { version = "0.4.8", optional = true }
dotenv = { version = "0.15.0", optional = true }
warp = { version = "~0.3.1", optional = true }
futures = { version = "~0.3.4", optional = true }
tokio-timer = { version = "~0.2.13", optional = true }
hyper = { version = "~0.14.9", optional = true, features = ["client", "server", "http1", "http2", "tcp"] }
tokio = { version = "~1.7.0", optional = true, features = ["full"] }

rusoto_core = { version = "~0.46.0", optional = true }
rusoto_dynamodb = { version = "~0.46.0", optional = true }
async-trait = "*"
http = "*"

postgres = { version = "0.19.1", optional = true, features = ["with-chrono-0_4", "with-uuid-0_8", "with-serde_json-1"] }

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["v4", "serde"]

[dependencies.rusqlite]
version = "*"
features = ["bundled", "chrono", "serde_json", "trace"]
optional = true