[package]
name = "event_source"
version = "0.1.0"
authors = ["Duane R Bailey <bailey.d.r@gmail.com>"]
edition = "2018"

[features]
default = ["sqlite", "tokio"]

sqlite = ["rusqlite"]
psql = ["postgres", "postgres-native-tls", "native-tls"]

full = ["sqlite", "psql"]

[dependencies]
bytes = "*"
serde = "*"
serde_json = "*"
serde_derive = "*"
pretty_env_logger = "*"
either = "*"
chashmap = "*"

log = "~0.4.8"

dotenv = { version = "0.15.0", optional = true }
futures = { version = "~0.3.4", optional = true }
tokio-timer = { version = "~0.2.13", optional = true }
tokio = { version = "~1.7.0", optional = true, features = ["full"] }

async-trait = "*"

postgres = { version = "0.19.1", optional = true, features = ["with-chrono-0_4", "with-uuid-0_8", "with-serde_json-1"] }
postgres-native-tls = { version = "*", optional = true }
native-tls = { version = "*", optional = true }
toml = "*"

[dependencies.chrono]
version = "*"
features = ["serde"]

[dependencies.uuid]
version = "*"
features = ["v4", "serde"]

[dependencies.rusqlite]
version = "*"
features = ["bundled", "chrono", "serde_json", "trace"]
optional = true